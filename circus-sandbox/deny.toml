# cargo-deny 0.20.2. Unlisted licenses fail. Vulnerability advisories always
# fail and must not be listed under ignore. Unknown registries and git sources fail.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
yanked = "deny"
unsound = "all"
# Maintenance notices are not vulnerability advisories. Do not ignore either.
unmaintained = "all"
unused-ignored-advisory = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    # winx 0.36.4 declares only this expression; it is not an alias of Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    # unicode-ident 1.0.27 is (MIT OR Apache-2.0) AND Unicode-3.0.
    "Unicode-3.0",
    # matchit 0.8.4 (through axum) is MIT AND BSD-3-Clause; permissive, OSI and
    # FSF approved, and required by the only selected HTTP framework.
    "BSD-3-Clause",
    # foldhash 0.1.5 (through hashbrown in the containerd gRPC stack) is Zlib;
    # permissive and both OSI and FSF approved.
    "Zlib",
    # ring 0.17.14 is (Apache-2.0 AND ISC), rustls-webpki 0.103.16 and
    # untrusted 0.9.0 are ISC. These come only from the optional `kubernetes`
    # feature's rustls TLS stack; ISC is permissive and OSI/FSF approved.
    "ISC",
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
