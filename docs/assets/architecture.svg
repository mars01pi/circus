<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Circus Rust control plane and agent isolation architecture</title>
  <desc id="desc">The current Paseo sandbox-provider task path connects a Node daemon to the Rust control plane through the bounded stdio bridge, AgentRunner and circus-sandbox lifecycle. Rust validates task policy, inspects the effective backend policy and owns cleanup while Docker and runc enforce the current agent isolation. Model and authorized MCP requests travel over process standard streams to the host credential broker, which injects host-held credentials and enforces destinations, tools and fixed resource parameters. The separate circus-sandbox-exec provider proxy reuses circus-sandbox and is outside this path.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 H 0 V 32" fill="none" stroke="#1e293b" stroke-width=".65"/></pattern>
    <marker id="arrow" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-rose" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#020617"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect x="40" y="39" width="8" height="8" rx="4" fill="#fb923c"/>
  <text x="60" y="47" fill="#fb923c" font-family="monospace" font-size="14" font-weight="700">CIRCUS / RUST CONTROL PLANE</text>
  <text x="40" y="95" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Rust owns the task contract. Docker + runc isolate execution.</text>
  <text x="40" y="125" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Paseo selects boundaries · host brokers services · cleanup is part of success</text>

