name: Sandbox containerd

# Real containerd + runc evidence for the opt-in containerd integration suites.
# The daemon is started on the runner and the image is pulled with `ctr`, so
# this workflow performs no Docker Engine work and complements (does not
# replace) `Sandbox Docker`. Absence, cancellation, or failure of this workflow
# is never a green claim about container isolation.
#
# No path filters: circus-sandbox is the whole crate, and a skipped workflow
# stays pending when a ruleset requires the check.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sandbox-containerd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The suites assert this opt-in explicitly; they never connect without it.
  CIRCUS_CONTAINERD: "1"
  CIRCUS_CONTAINERD_SOCKET: /run/containerd/containerd.sock
  CIRCUS_CONTAINERD_IMAGE: python:3.12-slim
  CIRCUS_CONTAINERD_NAMESPACE: default

jobs:
  containerd:
    name: containerd (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - containerd_sandbox
          - containerd_snapshot
          - containerd_process
          - containerd_pool
          - containerd_image_environment
    defaults:
      run:
        working-directory: circus-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y \
            --default-toolchain 1.99.1 \
            --profile minimal \
            --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Require Rust 1.99.1
        shell: bash
        run: |
          set -euo pipefail
          ver="$(rustc --version)"
          printf '%s\n' "$ver"
          cargo --version
          case "$ver" in
            *" 1.99.1 "*) ;;
            *) echo "expected rustc 1.99.1, got: $ver" >&2; exit 1 ;;
          esac

      # containerd-client generates its gRPC bindings at build time.
      - name: Install protobuf compiler
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Start containerd
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -S /run/containerd/containerd.sock ]; then
            sudo sh -c "containerd > '$RUNNER_TEMP/containerd.log' 2>&1 &"
          fi
          for _ in $(seq 1 100); do
            if [ -S /run/containerd/containerd.sock ]; then break; fi
            sleep 0.2
          done
          sudo ctr version
          sudo ctr snapshots --snapshotter overlayfs list >/dev/null

      - name: Pull and unpack test image
        shell: bash
        run: |
          set -euo pipefail
          # containerd's client unpacks on pull by default here; our backend also
          # unpacks local layers when committed snapshots are missing.
          sudo ctr -n default images pull docker.io/library/python:3.12-slim

      - name: Print containerd version and image digest
        shell: bash
        run: |
          set -euo pipefail
          sudo ctr version
          sudo ctr -n default images list | grep python

      - name: Run ignored ${{ matrix.suite }} suite
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=CIRCUS_CONTAINERD,CIRCUS_CONTAINERD_SOCKET,CIRCUS_CONTAINERD_IMAGE,CIRCUS_CONTAINERD_NAMESPACE,CARGO_TERM_COLOR \
            env "PATH=$HOME/.cargo/bin:$PATH" \
            cargo test --locked --features containerd --test "${{ matrix.suite }}" -- --ignored
